<!-- 在 <div class="main-content"> 里面的第一个 <div class="panel"> 前面插入 -->
<div class="panel" style="padding: 15px 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <h2 style="font-size: 1rem; border: none; padding: 0; margin: 0;">主控供电预算</h2>
        <span id="power-text" style="font-size: 13px; font-weight: bold; color: #28a745;">0 mA / 450 mA (0%)</span>
    </div>
    <div style="width: 100%; height: 12px; background: #e9ecef; border-radius: 6px; overflow: hidden;">
        <div id="power-bar" style="height: 100%; width: 0%; background: #28a745; transition: width 0.3s, background-color 0.3s;"></div>
    </div>
</div>
